name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

# The jobs publish their logs (and the screenshots) to ci-output/<job> branches.
permissions:
  contents: write

# A newer push to a PR branch cancels its older run. Runs on main are never cancelled, so every
# main state that gets a run is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NERDS ships to Windows and Mac users, so both are tested (free runners on a public repo).
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # egui/winit/wgpu headers. The tray (ksni) and notifications (notify-rust over zbus) are
      # pure-Rust D-Bus clients, so no GTK, appindicator, xdo or libdbus packages are needed.
      - name: Install Linux system dependencies (egui/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/out/clippy.txt"
          exit "${PIPESTATUS[0]}"

      - name: Test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/out/test.txt"
          exit "${PIPESTATUS[0]}"

      - name: Publish the logs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-ci-output.sh "test-${{ runner.os }}" "$RUNNER_TEMP/out"

  wasm:
    name: wasm32 check + trunk build
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm32
      - name: Check wasm-safe crates
        run: cargo xtask wasm
      - name: Clippy (wasm32)
        run: cargo clippy -p artcraft-launcher-core -p artcraft-launcher-web --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Install trunk
        run: |
          curl --proto '=https' -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version
      # The same build and zip the release makes (size gate and relative-URL check included).
      - name: Build and zip the web app
        run: packaging/web/package.sh

  # Screenshots of the launcher (grid, table, Settings… in light and dark), drawn by the UI tests
  # with a software GPU (Mesa lavapipe), published to the branch ci-output/screenshots.
  screenshots:
    name: screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system dependencies (egui/winit, software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: screenshots
      - name: Draw the screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          ARTCRAFT_LAUNCHER_SNAPSHOTS="$RUNNER_TEMP/screenshots" WGPU_BACKEND=vulkan \
            cargo test -p artcraft-launcher-ui-egui --test ui --locked -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/screenshots/log.txt"
          exit "${PIPESTATUS[0]}"
      - name: Publish the screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-ci-output.sh screenshots "$RUNNER_TEMP/screenshots"
