# NERDS Launcher release: Windows and macOS installers, built on GitHub's free runners.
#
# Run it from the Actions tab (Release → Run workflow), or push to the `release` branch. It builds
#   nerds-launcher-<version>-windows-x64.msi            installer (per user, no admin rights)
#   nerds-launcher-<version>-windows-x64-portable.zip   no install: unzip and run
#   nerds-launcher-<version>-macos-universal.dmg        Apple silicon and Intel Macs
# with SHA256SUMS.txt, and publishes them as the GitHub Release v<version> (the version is
# [workspace.package] version in Cargo.toml; bump it with `cargo xtask version set X.Y.Z`).
#
# Signing is optional. With no secrets set the files are unsigned: Windows SmartScreen asks
# "More info → Run anyway", and macOS asks for System Settings → Privacy & Security → Open Anyway.
# To sign, add the repository secrets WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD (a PFX,
# base64) and, for macOS, APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD,
# APPLE_ID, APPLE_PASSWORD (app-specific) and APPLE_TEAM_ID; the packaging scripts pick them up.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Read the version from Cargo.toml
        run: |
          . packaging/env.sh
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$VERSION" =~ $semver ]] || { echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1; }
          case "$VERSION" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "version=$VERSION"; echo "prerelease=$pre"; } >>"$GITHUB_OUTPUT"
          echo "### NERDS Launcher v$VERSION (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      ARTCRAFT_LAUNCHER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-x64
      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      ARTCRAFT_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      # Secrets can't be read in `if:`; this says whether the signing certificate is set.
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos-universal
      # The DMG window's background and layout name the volume, so they are drawn here from
      # packaging/macos/dmg/background.svg (and uploaded, to be committed).
      - name: Draw the DMG window
        run: |
          brew install resvg
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pillow>=12' ds_store==1.3.3 mac_alias==2.2.3
          "$RUNNER_TEMP/venv/bin/python" packaging/macos/dmg/generate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-layout
          path: |
            packaging/macos/dmg/background.tiff
            packaging/macos/dmg/dmg-layout.DS_Store
      - name: Import the signing certificate
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Create the release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump the version (cargo xtask version set X.Y.Z) and run again, or delete that release first."
            exit 1
          fi
          pre=(); [ "$PRERELEASE" = "true" ] && pre=(--prerelease)
          gh release create "$tag" --target "$GITHUB_SHA" --title "NERDS Launcher v$VERSION" "${pre[@]}" \
            --notes "Download the installer for your computer:

          - **Windows:** \`nerds-launcher-$VERSION-windows-x64.msi\` (or the \`-portable.zip\` to run without installing)
          - **Mac:** \`nerds-launcher-$VERSION-macos-universal.dmg\`, then drag NERDS Launcher to Applications

          First launch: Windows may say \"Windows protected your PC\": click **More info → Run anyway**. On a Mac, if it won't open, go to **System Settings → Privacy & Security** and click **Open Anyway**." \
            -- *
          echo "Published [$tag](https://github.com/$GH_REPO/releases/tag/$tag)" >>"$GITHUB_STEP_SUMMARY"
